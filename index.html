<!DOCTYPE html>
<html lang = "pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopets</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <div>
        <h1>BUSQUE SEU AMIGO DE ESTIMAÇÃO</h1>
    </div>

    <form id="pet-form">
    <input type="hidden" id="pet-id" />
    <input type="text" id="pet-nome" placeholder="Nome do Pet">
    <input type="text" id="pet-especie" placeholder="Espécie do Pet">
    <input type="text" id="pet-raca" placeholder="Raça do Pet">
    <button type="submit">Salvar</button>
    <button type="button" id="botao-cancelar">Cancelar</button>
  </form>   

    <section id="lista-de-pets-container">
        
        <ul id="lista-pets"></ul>
      </section>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
